services:
  - type: web
    name: urologie-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false
      - key: SEVEN_API_KEY
        sync: false
      - key: BACKEND_URL
        value: https://urologie-backend.onrender.com
      - key: PORT
        value: "3002"
